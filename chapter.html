<!DOCTYPE html>
<html>
<head>

<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Viewer</title>

  <script src="chapters.js" defer></script>

  

  <style>

#topMenu {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%) translateY(-100%);

  display: flex;
  gap: 12px;

  padding: 12px 20px;

  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);

  border-radius: 0 0 12px 12px;

  z-index: 1000;

  transition: transform 0.25s ease;
}

#topMenu.show {
  transform: translateX(-50%) translateY(0);
}

#topMenu a,
#topMenu button {
  background: rgba(255, 255, 255, 0.12);
  color: white;

  border: 1px solid rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(10px);

  padding: 10px 14px;
  border-radius: 10px;

  font-size: 20px;
  font-family: inherit;

  cursor: pointer;
  transition: 0.2s ease;
}

#topMenu a:hover,
#topMenu button:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}

#topMenu a:active,
#topMenu button:active {
  transform: translateY(0px);
}
}

@media (hover: none), (pointer: coarse) {
  #topMenu {
    display: none;
  }
}
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    img {
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
      display: block;
    }

    .zone {
      position: fixed;
      top: 0;
      height: 100vh;
      width: 50vw;
    }

    #left { left: 0; }
    #right { right: 0; }
  </style>
</head>

<body>

<div id="topMenu">

  <a href="index.html">Home</a>

  <button id="prevChapter">Previous Chapter</button>

  <button id="nextChapter">Next Chapter</button>

  <button id="fullscreenBtn">Fullscreen</button>

</div>

  <img id="panel">

  <div id="left" class="zone"></div>
  <div id="right" class="zone"></div>

  <script>

const params = new URLSearchParams(window.location.search);
const chapterIndex = parseInt(params.get("ch")) || 0;

const chapterData = [
  { panels: 68 },
  { panels: 22 },
  { panels: 06 }
];

const totalPanels = chapterData[chapterIndex].panels;
const chapterNumber = chapterIndex + 1;
const chapterFolder = `images/chapter${chapterNumber}/`;

const images = [];

for (let i = 1; i <= totalPanels; i++) {
  const num = String(i).padStart(3, '0');
  images.push(`${chapterFolder}${num}.jpg`);
}

let index = 0;

if (window.location.hash === "#last") {
  index = images.length - 1;
}

const panel = document.getElementById("panel");
panel.src = images[index];

function enterFullscreen() {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }
}

document.getElementById("fullscreenBtn").onclick = () => {
  const el = document.documentElement;

  if (!document.fullscreenElement) {
    el.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
};

document.getElementById("right").onclick = () => {

  // FIRST PANEL ONLY
  if (index === 0) {
    enterFullscreen();
  }

  if (index < images.length - 1) {
    index++;
    panel.src = images[index];
  } else {
    const nextChapter = chapterIndex + 1;

    if (chapterData[nextChapter]) {
      window.location.href = `chapter.html?ch=${nextChapter}`;
    } else {
      window.location.href = "./end.html";
    }
  }
};

document.getElementById("left").onclick = () => {
  if (index > 0) {
    index--;
    panel.src = images[index];
  } else {
    const prevChapter = chapterIndex - 1;

    if (chapterData[prevChapter]) {
      window.location.href = `chapter.html?ch=${prevChapter}#last`;
    } else {
      window.location.href = "index.html";
    }
  }
};

document.addEventListener("keydown", (event) => {

  if (event.key === "ArrowRight") {
    document.getElementById("right").click();
  }

  if (event.key === "ArrowLeft") {
    document.getElementById("left").click();
  }

});

const topMenu = document.getElementById("topMenu");

document.addEventListener("mousemove", (e) => {

  if (e.clientY < 60) {
    topMenu.classList.add("show");
  } else {
    topMenu.classList.remove("show");
  }

});

document.getElementById("prevChapter").onclick = () => {

  if (chapterIndex > 0) {
    window.location.href = `chapter.html?ch=${chapterIndex - 1}`;
  }

};

document.getElementById("nextChapter").onclick = () => {

  if (chapterData[chapterIndex + 1]) {
    window.location.href = `chapter.html?ch=${chapterIndex + 1}`;
  }

};

  </script>

</body>
</html>
